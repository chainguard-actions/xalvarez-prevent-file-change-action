name: Test trusted author bypass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pattern: '.*\.lock$'
          trustedAuthors: ${{ github.actor }}
      - name: Assert trusted author succeeds regardless of event
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "actor: $ACTOR"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for trusted author"
            exit 1
          fi
          echo "PASS"
