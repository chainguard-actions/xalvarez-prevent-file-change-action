name: Test trusted author bypass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with trusted author
        id: action
        # The action checks context.actor against trustedAuthors.
        # We use ${{ github.actor }} as the trusted author so that whatever
        # actor act uses, it will match and the action will succeed without
        # needing a pull_request_target event.
        continue-on-error: true
        uses: .
        with:
          githubToken: ${{ github.token }}
          pattern: '.*\.lock$'
          trustedAuthors: '${{ github.actor }}'
      - name: Assert action succeeded (trusted author bypasses PR check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed for trusted author, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: trusted author bypass works correctly"
