name: Test multiple trusted authors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current actor
        id: get-actor
        run: |
          echo "actor=${{ github.actor }}" >> "$GITHUB_OUTPUT"
          echo "Current actor: ${{ github.actor }}"

      - name: Run action with actor in a list of trusted authors
        id: action
        uses: .
        with:
          githubToken: ${{ github.token }}
          pattern: '.*\.lock$'
          trustedAuthors: "someOtherUser, ${{ steps.get-actor.outputs.actor }}, anotherUser"
        continue-on-error: true

      - name: Assert action succeeded when actor is in trusted authors list
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when actor is in trusted authors list, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly succeeded when actor is in comma-separated trusted authors list"
