name: Test trusted author in comma separated list with spaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pattern: '^package-lock\.json$'
          trustedAuthors: 'someone-else ,  ${{ github.actor }}  , another-user'
          allowNewFiles: 'true'
          closePR: 'true'
      - name: Assert trusted author matched after trimming
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when actor is in trimmed list"
            exit 1
          fi
          echo "PASS"
