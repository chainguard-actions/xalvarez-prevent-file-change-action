name: Test wrong event type failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-pull_request_target event
        id: action
        # Under workflow_dispatch, context.eventName = 'workflow_dispatch'.
        # The action only supports pull_request_target, so it should fail
        # with a specific error message. We use an empty trustedAuthors so
        # the trusted-author bypass does not trigger.
        continue-on-error: true
        uses: .
        with:
          githubToken: ${{ github.token }}
          pattern: '.*\.lock$'
          trustedAuthors: ''
      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-pull_request_target event, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-pull_request_target event"
