name: Test allowNewFiles input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with allowNewFiles input
        id: action
        # The action checks context.actor against trustedAuthors first.
        # We use ${{ github.actor }} as the trusted author so the action
        # succeeds without needing a pull_request_target event.
        # allowNewFiles is also passed to ensure it is covered.
        continue-on-error: true
        uses: .
        with:
          githubToken: ${{ github.token }}
          pattern: '.*\\.lock$'
          trustedAuthors: '${{ github.actor }}'
          allowNewFiles: 'true'
      - name: Assert action succeeded (trusted author bypasses PR check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed for trusted author with allowNewFiles=true, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: allowNewFiles input accepted and trusted author bypass works correctly"
