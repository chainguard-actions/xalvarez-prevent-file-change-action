name: Test missing pull request number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          githubToken: fake-token
          pattern: '.*\.lock'

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not running in a pull_request_target context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pull request context is missing"
