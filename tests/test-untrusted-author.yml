name: Test untrusted author is not bypassed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pattern: '.*\.lock$'
          trustedAuthors: 'definitely-not-the-actor-1, definitely-not-the-actor-2'
      - name: Assert action failed for untrusted author
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for untrusted author on non pull_request_target event"
            exit 1
          fi
          echo "PASS"
